name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full CI has to be green before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  # ==========================================================================
  # Build and package the release tarballs
  # ==========================================================================
  build-dist:
    name: Package (${{ matrix.target }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}

      # See ci.yml: `cross` supplies the musl toolchain for both arches.
      - uses: taiki-e/install-action@cross

      - name: Build sleepytale
        run: cross build --release --locked -p sleepytale --target ${{ matrix.target }}

      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp "target/${TARGET}/release/sleepytale" staging/
          tar -czf "dist/sleepytale-${TAG}-${TARGET}.tar.gz" -C staging sleepytale
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ==========================================================================
  # Publish the GitHub release
  # ==========================================================================
  release:
    name: Create Release
    needs: build-dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "sleepytale ${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz \
            dist/checksums.sha256
